<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tim Harness — 装进一个浏览器页面的随身大模型工程 Harness" />
    <title>Tim Harness</title>
    <script>
      // 提前应用主题，避免闪白
      try {
        var t = localStorage.getItem('tim-harness:theme')
        if (t === 'light') document.documentElement.dataset.theme = 'light'
        else if (t === 'dark') document.documentElement.dataset.theme = 'dark'
        else document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
