<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Anatomy 风格：Harness 过程机械可视化</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0A0E14; color:#E6EDF3; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; overflow:hidden; }
  svg { width:100vw; height:100vh; }

  /* 机械组件标签 */
  .label { font-size:11px; fill:#9DA7B3; letter-spacing:.5px; }
  .label-title { font-size:13px; fill:#E6EDF3; font-weight:600; }
  .label-dim { font-size:10px; fill:#6E7681; }

  /* 齿轮动画 */
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes spin-rev { from { transform:rotate(360deg); } to { transform:rotate(0deg); } }
  @keyframes piston { 0%,100% { transform:translateY(0); } 50% { transform:translateY(6px); } }
  @keyframes flow { from { stroke-dashoffset:20; } to { stroke-dashoffset:0; } }
  @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }
  @keyframes gauge-fill { from { height:0; } to { height:var(--fill); } }

  .gear { transform-origin:center; animation:spin 3s linear infinite; }
  .gear-rev { transform-origin:center; animation:spin-rev 2s linear infinite; }
  .gear-fast { transform-origin:center; animation:spin 1s linear infinite; }
  .piston { animation:piston 1.5s ease-in-out infinite; }
  .flow-line { stroke-dasharray:8 4; animation:flow 1s linear infinite; }
  .pulse-dot { animation:pulse 2s ease-in-out infinite; }

  /* 仪表 */
  .gauge-bg { fill:#161B22; stroke:#30363D; }
  .gauge-fill { fill:#238636; }
  .gauge-label { font-size:9px; fill:#9DA7B3; }

  /* 交互 */
  .machine-part { cursor:pointer; transition:filter .2s; }
  .machine-part:hover { filter:brightness(1.5) drop-shadow(0 0 8px rgba(88,166,255,.3)); }
</style>
</head>
<body>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#0A0E14"/>

  <!-- 标题 -->
  <text x="600" y="30" text-anchor="middle" class="label-title" style="font-size:18px">
    AGENT HARNESS — 机械运作图
  </text>
  <text x="600" y="50" text-anchor="middle" class="label-dim">
    "做一张极简自我介绍卡片" 全过程
  </text>

  <!-- ═══ 阶段 1：用户输入漏斗 ═══ -->
  <g class="machine-part" transform="translate(100,100)">
    <text x="60" y="-10" class="label-title">📥 用户输入</text>
    <text x="60" y="5" class="label-dim">"做一张极简介绍卡片"</text>
    <!-- 漏斗 -->
    <path d="M 20 20 L 100 20 L 80 60 L 40 60 Z" fill="#1C2128" stroke="#58A6FF" stroke-width="1.5"/>
    <!-- 数据流下落 -->
    <circle cx="60" cy="25" r="3" fill="#58A6FF" class="pulse-dot"/>
    <circle cx="55" cy="35" r="2" fill="#58A6FF" opacity=".6"/>
    <circle cx="65" cy="45" r="2.5" fill="#58A6FF" opacity=".4"/>
    <!-- 输出管道 -->
    <rect x="50" y="60" width="20" height="30" fill="none" stroke="#30363D" stroke-width="1"/>
    <line x1="60" y1="60" x2="60" y2="90" stroke="#58A6FF" stroke-width="2" class="flow-line"/>
  </g>

  <!-- ═══ 阶段 2：上下文窗口容器 ═══ -->
  <g class="machine-part" transform="translate(250,80)">
    <text x="50" y="-10" class="label-title">📦 上下文窗口</text>
    <text x="50" y="5" class="label-dim">64K tokens</text>
    <!-- 容器 -->
    <rect x="10" y="15" width="80" height="100" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <!-- 填充液位 -->
    <rect x="12" y="55" width="76" height="58" rx="3" fill="rgba(35,134,54,.15)"/>
    <rect x="12" y="55" width="76" height="58" rx="3" fill="#238636" opacity=".3"/>
    <!-- 液面波动线 -->
    <path d="M 12 55 Q 30 52 50 55 T 88 55" stroke="#238636" stroke-width="1.5" fill="none" opacity=".6"/>
    <!-- 刻度 -->
    <line x1="90" y1="25" x2="94" y2="25" stroke="#30363D"/><text x="96" y="28" class="gauge-label">64K</text>
    <line x1="90" y1="55" x2="94" y2="55" stroke="#30363D"/><text x="96" y="58" class="gauge-label">32K</text>
    <line x1="90" y1="85" x2="94" y2="85" stroke="#30363D"/><text x="96" y="88" class="gauge-label">16K</text>
    <line x1="90" y1="112" x2="94" y2="112" stroke="#30363D"/><text x="96" y="115" class="gauge-label">0</text>
    <!-- 当前水位标记 -->
    <text x="50" y="52" text-anchor="middle" class="gauge-label" fill="#238636">▼ ~8K used</text>
  </g>

  <!-- ═══ 阶段 3：Agent 思考腔（核心齿轮组） ═══ -->
  <g class="machine-part" transform="translate(450,100)">
    <text x="80" y="-10" class="label-title">🧠 Agent 推理引擎</text>
    <text x="80" y="5" class="label-dim">DeepSeek V4.1 Flash</text>

    <!-- 主齿轮 -->
    <g class="gear" style="transform-origin:80px 50px">
      <circle cx="80" cy="50" r="30" fill="none" stroke="#D29922" stroke-width="2"/>
      <circle cx="80" cy="50" r="22" fill="none" stroke="#D29922" stroke-width="1" opacity=".5"/>
      <!-- 齿 -->
      <g stroke="#D29922" stroke-width="2">
        <line x1="80" y1="20" x2="80" y2="12"/><line x1="80" y1="80" x2="80" y2="88"/>
        <line x1="50" y1="50" x2="42" y2="50"/><line x1="110" y1="50" x2="118" y2="50"/>
        <line x1="59" y1="29" x2="53" y2="23"/><line x1="101" y1="71" x2="107" y2="77"/>
        <line x1="101" y1="29" x2="107" y2="23"/><line x1="59" y1="71" x2="53" y2="77"/>
      </g>
      <circle cx="80" cy="50" r="6" fill="#D29922" opacity=".3"/>
    </g>

    <!-- 副齿轮（反向旋转） -->
    <g class="gear-rev" style="transform-origin:125px 70px">
      <circle cx="125" cy="70" r="18" fill="none" stroke="#A371F7" stroke-width="1.5"/>
      <circle cx="125" cy="70" r="12" fill="none" stroke="#A371F7" stroke-width="1" opacity=".4"/>
      <g stroke="#A371F7" stroke-width="1.5">
        <line x1="125" y1="52" x2="125" y2="47"/><line x1="125" y1="88" x2="125" y2="93"/>
        <line x1="107" y1="70" x2="102" y2="70"/><line x1="143" y1="70" x2="148" y2="70"/>
      </g>
    </g>

    <!-- 输入管道 -->
    <line x1="-30" y1="50" x2="45" y2="50" stroke="#58A6FF" stroke-width="2" class="flow-line"/>
    <text x="5" y="42" class="label-dim">prompt →</text>

    <!-- 输出管道（到工具选择器） -->
    <line x1="115" y1="50" x2="180" y2="50" stroke="#D29922" stroke-width="2" class="flow-line"/>
    <text x="130" y="42" class="label-dim">tool_calls →</text>
  </g>

  <!-- ═══ 阶段 4：工具选择分配器 ═══ -->
  <g class="machine-part" transform="translate(700,80)">
    <text x="60" y="-10" class="label-title">🔧 工具分配器</text>
    <text x="60" y="5" class="label-dim">路由到执行工位</text>

    <!-- 旋转分配盘 -->
    <g class="gear-fast" style="transform-origin:60px 60px">
      <circle cx="60" cy="60" r="35" fill="#1C2128" stroke="#F85149" stroke-width="1.5"/>
      <!-- 分配槽 -->
      <g stroke="#F85149" stroke-width="1" opacity=".5">
        <line x1="60" y1="25" x2="60" y2="35"/>
        <line x1="60" y1="85" x2="60" y2="95"/>
        <line x1="25" y1="60" x2="35" y2="60"/>
        <line x1="85" y1="60" x2="95" y2="60"/>
        <line x1="35" y1="35" x2="42" y2="42"/>
        <line x1="85" y1="85" x2="78" y2="78"/>
        <line x1="85" y1="35" x2="78" y2="42"/>
        <line x1="35" y1="85" x2="42" y2="78"/>
      </g>
      <circle cx="60" cy="60" r="8" fill="#F85149" opacity=".3"/>
      <text x="60" y="63" text-anchor="middle" fill="#F85149" font-size="9">⚙</text>
    </g>

    <!-- 分支管道 -->
    <line x1="60" y1="25" x2="60" y2="0" stroke="#F85149" stroke-width="1.5" class="flow-line"/>
    <line x1="95" y1="60" x2="120" y2="60" stroke="#F85149" stroke-width="1.5" class="flow-line"/>
    <line x1="60" y1="95" x2="60" y2="120" stroke="#F85149" stroke-width="1.5" class="flow-line"/>
  </g>

  <!-- ═══ 阶段 5：工具执行工位 ═══ -->
  <g transform="translate(150,350)">
    <text x="400" y="-10" class="label-title" style="font-size:15px">⚙ 工具执行流水线</text>

    <!-- 工位 A：skill 装载器 -->
    <g class="machine-part" transform="translate(0,20)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#161B22" stroke="#A371F7" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" class="label-title" fill="#A371F7">skill</text>
      <text x="70" y="35" text-anchor="middle" class="label-dim">装载设计品味技能</text>
      <!-- 活塞 -->
      <rect x="55" y="42" width="30" height="20" rx="3" fill="#A371F7" opacity=".2" class="piston"/>
      <text x="70" y="72" text-anchor="middle" class="gauge-label" fill="#3FB950">✓ 200ms</text>
    </g>

    <!-- 工位 B：JS 执行引擎 -->
    <g class="machine-part" transform="translate(160,20)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#161B22" stroke="#D29922" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" class="label-title" fill="#D29922">run_js</text>
      <text x="70" y="35" text-anchor="middle" class="label-dim">沙箱代码执行</text>
      <!-- 齿轮组 -->
      <g class="gear" style="transform-origin:50px 52px">
        <circle cx="50" cy="52" r="12" fill="none" stroke="#D29922" stroke-width="1.5"/>
        <line x1="50" y1="40" x2="50" y2="36" stroke="#D29922"/><line x1="50" y1="64" x2="50" y2="68" stroke="#D29922"/>
        <line x1="38" y1="52" x2="34" y2="52" stroke="#D29922"/><line x1="62" y1="52" x2="66" y2="52" stroke="#D29922"/>
      </g>
      <text x="70" y="72" text-anchor="middle" class="gauge-label" fill="#3FB950">✓ 400ms</text>
    </g>

    <!-- 工位 C：文件写入臂 -->
    <g class="machine-part" transform="translate(320,20)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" class="label-title" fill="#3FB950">write_file</text>
      <text x="70" y="35" text-anchor="middle" class="label-dim">写入 card.html</text>
      <!-- 机械臂 -->
      <line x1="70" y1="42" x2="70" y2="55" stroke="#3FB950" stroke-width="2"/>
      <circle cx="70" cy="58" r="4" fill="#3FB950" opacity=".5" class="pulse-dot"/>
      <text x="70" y="72" text-anchor="middle" class="gauge-label" fill="#3FB950">✓ 150ms</text>
    </g>

    <!-- 工位 D：编辑精调 -->
    <g class="machine-part" transform="translate(480,20)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#161B22" stroke="#F85149" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" class="label-title" fill="#F85149">edit_file</text>
      <text x="70" y="35" text-anchor="middle" class="label-dim">精调样式细节</text>
      <!-- 剪刀 -->
      <text x="70" y="55" text-anchor="middle" font-size="16" fill="#F85149" opacity=".5">✂</text>
      <text x="70" y="72" text-anchor="middle" class="gauge-label" fill="#3FB950">✓ 100ms</text>
    </g>

    <!-- 工位 E：验证读取 -->
    <g class="machine-part" transform="translate(640,20)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" class="label-title" fill="#58A6FF">read_file</text>
      <text x="70" y="35" text-anchor="middle" class="label-dim">验证最终结果</text>
      <!-- 镜头 -->
      <circle cx="70" cy="50" r="10" fill="none" stroke="#58A6FF" stroke-width="1.5"/>
      <circle cx="70" cy="50" r="5" fill="#58A6FF" opacity=".2"/>
      <text x="70" y="72" text-anchor="middle" class="gauge-label" fill="#3FB950">✓ 300ms</text>
    </g>

    <!-- 传送带 -->
    <line x1="0" y1="110" x2="780" y2="110" stroke="#30363D" stroke-width="3"/>
    <line x1="0" y1="110" x2="780" y2="110" stroke="#58A6FF" stroke-width="1" class="flow-line" opacity=".3"/>
    <!-- 滚轮 -->
    <g fill="#30363D">
      <circle cx="50" cy="115" r="5"/><circle cx="150" cy="115" r="5"/>
      <circle cx="250" cy="115" r="5"/><circle cx="350" cy="115" r="5"/>
      <circle cx="450" cy="115" r="5"/><circle cx="550" cy="115" r="5"/>
      <circle cx="650" cy="115" r="5"/><circle cx="750" cy="115" r="5"/>
    </g>
    <text x="390" y="132" text-anchor="middle" class="label-dim">数据在工位间流转</text>
  </g>

  <!-- ═══ 阶段 6：Token 计量器 ═══ -->
  <g class="machine-part" transform="translate(950,100)">
    <text x="60" y="-10" class="label-title">⛽ Token 消耗</text>
    <!-- 仪表盘 -->
    <rect x="10" y="15" width="100" height="60" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <!-- 模拟指针 -->
    <g transform="translate(60,55)">
      <line x1="0" y1="0" x2="25" y2="-20" stroke="#F85149" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#F85149"/>
    </g>
    <text x="60" y="68" text-anchor="middle" class="gauge-label">≈ 1,247 tokens</text>
    <!-- 缓存命中指示 -->
    <rect x="10" y="82" width="100" height="20" rx="3" fill="#161B22" stroke="#30363D"/>
    <rect x="12" y="84" width="75" height="16" rx="2" fill="#238636" opacity=".3"/>
    <text x="60" y="96" text-anchor="middle" class="gauge-label" fill="#238636">缓存命中 75%</text>
  </g>

  <!-- ═══ 阶段 7：输出装配线 ═══ -->
  <g class="machine-part" transform="translate(950,250)">
    <text x="60" y="-10" class="label-title">📤 输出装配</text>
    <!-- 装配槽 -->
    <rect x="10" y="15" width="100" height="70" rx="6" fill="#1C2128" stroke="#3FB950" stroke-width="1.5"/>
    <!-- 卡片预览（极简风格） -->
    <rect x="25" y="25" width="70" height="50" rx="3" fill="#0D1117" stroke="#30363D"/>
    <text x="60" y="42" text-anchor="middle" font-size="10" fill="#E6EDF3">TIM</text>
    <text x="60" y="55" text-anchor="middle" font-size="7" fill="#9DA7B3">浏览器原生 harness</text>
    <text x="60" y="68" text-anchor="middle" font-size="6" fill="#6E7681">零安装 · 随时随地</text>
    <!-- 输出状态 -->
    <text x="60" y="95" text-anchor="middle" class="gauge-label" fill="#3FB950">✓ 完成</text>
  </g>

  <!-- ═══ 连接管道系统 ═══ -->
  <!-- 主数据流 -->
  <path d="M 160 160 C 200 160, 220 130, 250 130" stroke="#58A6FF" stroke-width="2" fill="none" class="flow-line" opacity=".5"/>
  <path d="M 340 130 C 380 130, 400 150, 450 150" stroke="#D29922" stroke-width="2" fill="none" class="flow-line" opacity=".5"/>
  <path d="M 620 150 C 660 150, 680 140, 700 140" stroke="#F85149" stroke-width="2" fill="none" class="flow-line" opacity=".5"/>

  <!-- 工具结果回流 -->
  <path d="M 220 370 C 200 300, 300 250, 450 180" stroke="#3FB950" stroke-width="1.5" fill="none" class="flow-line" opacity=".3"/>
  <path d="M 380 370 C 360 300, 400 250, 470 180" stroke="#3FB950" stroke-width="1.5" fill="none" class="flow-line" opacity=".3"/>

  <!-- 输出流 -->
  <path d="M 770 370 C 850 370, 900 300, 960 300" stroke="#3FB950" stroke-width="2" fill="none" class="flow-line" opacity=".5"/>

  <!-- ═══ 回合标注 ═══ -->
  <g opacity=".3">
    <line x1="100" y1="480" x2="1100" y2="480" stroke="#30363D" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="150" y="500" class="label-dim">回合 1: 需求理解</text>
    <text x="400" y="500" class="label-dim">回合 2: 创建执行</text>
    <text x="650" y="500" class="label-dim">回合 3: 验证交付</text>
  </g>

  <!-- ═══ 底部说明 ═══ -->
  <text x="600" y="780" text-anchor="middle" class="label-dim" style="font-size:10px">
    每个组件都是可交互的机械零件 · 悬停查看详情 · 齿轮转速 = 执行速度 · 液位 = 上下文占用
  </text>
</svg>
</body>
</html>
